name: Bug report
description: Report a reproducible problem with the widget, service, CLI, or skill.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected behavior and the smallest reproduction you can share.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: dropdown
    id: router
    attributes:
      label: Router type
      options: [History, Hash, Custom, Not applicable]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed review tokens, customer data, credentials, and private prototype content.
          required: true
